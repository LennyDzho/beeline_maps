# Keep the OS charset for Gradle/JDK 17 @argfiles on Windows with Cyrillic paths.
# Kotlin and Android resources are UTF-8 independently of the Gradle process charset.
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
# The parent workspace has Cyrillic characters; all sources use UTF-8.
android.overridePathCheck=true
